
plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version + "-" + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {

	maven { url "https://api.modrinth.com/maven" }
	maven { url "https://maven.terraformersmc.com/"}
	maven { url "https://maven.shedaniel.me/" }

	// Ponder
	maven { url "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
	maven { url "https://maven.createmod.net" }

	// Mixin Squared
	maven { url = "https://maven.bawnorton.com/releases" }
	// Mirror
	maven { url = "https://maven.enjarai.dev/mirrors" }

}

fabricApi {
	configureDataGeneration() {
		modId = "btwr_ds"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"btwr_ds" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// BTWR Shared Library
	modImplementation "maven.modrinth:btwr-shared-library:${project.btwr_sl_version}"
	//modImplementation files("libs/btwr-shared-library-${project.btwr_sl_version}.jar")

	// BTWR related mods
	modImplementation "maven.modrinth:btwr-core:${project.btwr_core_version}"
	modImplementation "maven.modrinth:self-sustainable:${project.self_sustainable_version}"
	modImplementation "maven.modrinth:sturdy-trees:${project.sturdy_trees_version}"
	modImplementation "maven.modrinth:tough-environment:${project.tough_environment_version}"
	modImplementation "maven.modrinth:better-with-time:${project.bwt_version}"
	modImplementation "maven.modrinth:animageddon:${project.animageddon_version}"
	modImplementation "maven.modrinth:vegehenna:${project.vegehenna_version}"
	modImplementation "maven.modrinth:granular-hunger:${project.granular_hunger_version}"
	modImplementation "maven.modrinth:im-movens:${project.im_movens_version}"
	modImplementation "maven.modrinth:bwt-hc-tweaks:${project.bwt_hct_version}"
	//modImplementation "maven.modrinth:bind:${project.bind_version}"
	modImplementation "maven.modrinth:material-beacons:${project.material_beacons_version}"
	modImplementation "maven.modrinth:piston-packing:${project.piston_packing_version}"
	modImplementation "maven.modrinth:nomads-rest:${project.nomads_rest_version}-fabric"

	//modImplementation files("libs/btwr-core-${project.btwr_core_version}-1.21.1.jar")
	//modImplementation files("libs/self-sustainable-${project.self_sustainable_version}-1.21.1.jar")
	//modImplementation files("libs/sturdy-trees-${project.sturdy_trees_version}-1.21.1.jar")
	//modImplementation files("libs/tough_environment-${project.tough_environment_version}-1.21.1.jar")
	//modImplementation files("libs/better_with_time-${project.bwt_version}.jar")
	//modImplementation files("libs/vegehenna-${project.vegehenna_version}-1.21.1.jar")
	//modImplementation files("libs/im-movens-${project.im_movens_version}-1.21.1.jar")
	//modImplementation files("libs/bwt-hc-tweaks-${project.bwt_hct_version}.jar")
	//modImplementation files("libs/piston-packing-${project.piston_packing_version}.jar")
	//modImplementation files("libs/nomads-rest-${project.nomads_rest_version}.jar")


	// EMI
	//modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
	//modLocalRuntime "dev.emi:emi-fabric:${emi_version}"
	modCompileOnlyApi  "dev.emi:emi-fabric:${emi_version}"
	modLocalRuntime "dev.emi:emi-fabric:${emi_version}"

	// Cloth Config
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Mod Menu
	modApi "com.terraformersmc:modmenu:${project.mod_menu_version}"

	// Ponder
	modImplementation "net.createmod.ponder:Ponder-Fabric-${minecraft_version}:${ponder_version}"

	// Mixin Squared
	include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${mixin_squared_version}")))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}

	loom {
		accessWidenerPath = file("src/main/resources/btwr_ds.accesswidener")
	}
}

